<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カルーセルサンプル（Braze CDN版）</title>

    <!-- Braze Web SDK (CDN) -->
    <script src="https://js.appboycdn.com/web-sdk/5.0/braze.min.js"></script>

    <style>
        /* カルーセル全体のスタイル */
        .carousel {
            position: relative;
            width: 80%;
            height: 400px;
            margin: auto;
            overflow: hidden;
        }

        /* カルーセル内のアイテムを横に並べる */
        .carousel-items {
            display: flex;
            transition: transform 0.5s ease;
        }

        /* 各アイテムのスタイル */
        .carousel-item {
            min-width: 100%;
            text-align: center;
            font-size: 24px;
            background-color: #f0f0f0;
            padding: 0;
        }

        /* ナビゲーションボタンのスタイル */
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }
    </style>
</head>
<body>

<div class="carousel">
    <div class="carousel-items">
        <div class="carousel-item"><img id="img_contentcard-target" src="./img/matsuri.png" /></div>
        <div class="carousel-item"><img src="./img/cat.png" /></div>
        <div class="carousel-item"><img src="./img/fujisan.png" /></div>
        <div class="carousel-item"><img src="./img/samurai.png" /></div>
    </div>
    <button class="prev" onclick="showPrevItem()">&#10094;</button>
    <button class="next" onclick="showNextItem()">&#10095;</button>
</div>

<script>
    // カルーセル制御
    let index = 0;
    const items = document.querySelectorAll('.carousel-item');
    const totalItems = items.length;

    function showNextItem() {
        index = (index + 1) % totalItems;
        document.querySelector('.carousel-items').style.transform = `translateX(${-index * 100}%)`;
    }

    function showPrevItem() {
        index = (index - 1 + totalItems) % totalItems;
        document.querySelector('.carousel-items').style.transform = `translateX(${-index * 100}%)`;
    }
</script>

  // ====================================
  // コンテンツカード処理

  var TARGET_ELEMENT_SELECTOR = '#img_contentcard-target';  // 上書きしたい要素のセレクタを指定
  var TARGET_FRAME_ID = 'carousel_banner'; //Braze画面で key:value = frame_id:carousel_banner
  var REFRESH_INTERVAL_MS = 3 * 60 * 1000;  // 3分（ミリ秒）
  var LAST_REFRESH_KEY = 'braze_contentcards_last_refresh';

  // コンテンツカードを処理する共通関数
  function processContentCards(cards) {
      var targetCards = [];

      // フレームIDが一致するカードを抽出
      for (var i = 0; i < cards.length; i++) {
          if (cards[i].extras && cards[i].extras.frame_id === TARGET_FRAME_ID) {
              targetCards.push(cards[i]);
          }
      }

      if (targetCards.length > 0) {
          // updatedでソートして最新のカードを取得
          targetCards.sort(function(a, b) {
              return new Date(b.updated) - new Date(a.updated);  // 降順にソート
          });

          var latestCard = targetCards[0];  // 最新のカードを取得

          // 既存の画像タグのsrcを最新カードのimageUrlで上書き
          var imgElement = document.querySelector(TARGET_ELEMENT_SELECTOR);
          if (imgElement) {
              imgElement.src = latestCard.imageUrl;

              // クリック時にカードのURLへ遷移（重複登録防止）
              imgElement.onclick = function() {
                  braze.logContentCardClick(latestCard);
                  braze.requestImmediateDataFlush();
                  window.location.href = latestCard.url;  // カードのURLにリダイレクト
              };

              // インプレッションのログ
              braze.logContentCardImpressions([latestCard]);
          }
      }
  }

  // リフレッシュが必要かどうかを判定
  function shouldRefresh() {
      var lastRefresh = localStorage.getItem(LAST_REFRESH_KEY);
      if (!lastRefresh) {
          return true;  // 初回訪問
      }
      var elapsed = Date.now() - parseInt(lastRefresh, 10);
      return elapsed >= REFRESH_INTERVAL_MS;
  }

  // リフレッシュ日時を記録
  function recordRefreshTime() {
      localStorage.setItem(LAST_REFRESH_KEY, Date.now().toString());
  }

  // コンテンツカード取得処理（SDKロード完了後に実行）
  function initContentCards() {
      console.log("carousel-contentcards tag called (SDK loaded)");

      // SDKロード後にsubscribeする
      braze.subscribeToContentCardsUpdates(function(contentCards) {
          console.log("Content cards updated via subscription");
          processContentCards(contentCards.cards);
      });

      if (shouldRefresh()) {
          // 3分以上経過している場合: サーバーから最新を取得
          console.log("Refreshing content cards from server...");
          braze.requestContentCardsRefresh();

              processContentCards(cachedCards.cards);

</html>
